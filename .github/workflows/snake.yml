name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%238B5CF6&color_dots=%23EBEDF0,%23DDD6FE,%23C4B5FD,%238B5CF6,%235B21B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A78BFA&color_dots=%230D1117,%232E1065,%234C1D95,%236D28D9,%23A78BFA

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
